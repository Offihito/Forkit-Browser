[package]
name = "forkit"
version = "1.3.0"
description = "Open Source Browser Based on WebKitGTK (Linux) & WebView2 (Windows)"
authors = ["Offihito"]
edition = "2021"

[lib]
name = "forkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
rfd = "0.15"
url = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
arboard = "3"
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_34"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
